on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      AZURE_CONTAINER_REGISTRY:
        required: true
        type: string
      AZURE_REGISTRY_USERNAME:
        required: true
        type: string
      AZURE_REGISTRY_PASSWORD:
        required: true
        type: string
permissions:
  id-token: write
  contents: read

jobs:
  deploy_to_test:
    uses: CorporalCiprian/todo-template/.github/workflows/docker-build.yml@main
    with:
      env: dev
    secrets:
      AZURE_REGISTRY_USERNAME: ${{ secrets.AZURE_REGISTRY_USERNAME }}
      AZURE_REGISTRY_PASSWORD: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

  